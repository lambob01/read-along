name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    env:
      # svelte-check and the build both read this through $env/static/public and
      # fail if it is unset. Only the SvelteKit dev proxy ever uses the value,
      # so any syntactically valid origin does here.
      PUBLIC_ABS_ORIGIN: http://localhost:13378

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Matches the builder stage in the Dockerfile.
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Format
        run: npm run lint

      - name: Types
        run: npm run check

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

  # Builds the deployable image and pushes it to ghcr.io. `needs: check` is the
  # point of putting this in the same workflow rather than its own file: the
  # home server auto-updates to :latest, so an image must never exist unless
  # lint, types and tests passed on that exact commit.
  docker:
    needs: check
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # Provided automatically by Actions. No secret to create or rotate.
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          # `latest` is what the server follows; `sha-xxxxxxx` is what you pin
          # to when you need to roll back to a specific commit.
          tags: |
            type=raw,value=latest
            type=sha

      - uses: docker/build-push-action@v7
        with:
          context: .
          # Only amd64: the server is x86, and adding arm64 would build the
          # whole npm/vite stage under QEMU for nothing.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          # Includes org.opencontainers.image.source, which is what links the
          # package to this repo on GitHub.
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
